server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  charset utf-8;
  charset_types text/html text/css text/plain text/markdown application/json application/javascript;

  # Traefik terminates TLS, so nginx only ever sees http on port 80. An
  # absolute redirect would hand the browser back "http://host/..." and
  # downgrade the connection; relative ones keep the scheme the client used.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/markdown application/json application/javascript
             application/xml image/svg+xml application/linkset+json;

  # Blume writes a directory per page (/concepts/index.html). Naming
  # index.html explicitly serves it directly — $uri/ alone would answer the
  # bare path with a 301 to the trailing-slash form, costing every deep link
  # from the app an extra round trip.
  location / {
    try_files $uri $uri/index.html $uri/ =404;
  }

  # Hashed filenames — safe to pin forever.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # HTML must revalidate or a deploy stays invisible until the browser cache
  # ages out. Everything below it is content-addressed, so this is the only hop.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # nginx's mime.types has no entry for markdown, and a `types` block here
  # would replace the inherited map rather than extend it — which is how the
  # first cut of this file ended up serving every page as octet-stream.
  # default_type only fills in for extensions the map does not know, so it
  # adds markdown without touching anything else. These .md twins of each
  # page are what llms.txt points at.
  location ~* \.mdx?$ {
    default_type text/markdown;
  }

  # Mirrors dist/_headers, which is Netlify/Cloudflare syntax that nginx ignores.
  location ~ ^/\.well-known/(ai-catalog\.json|ard\.json|api-catalog)$ {
    add_header Access-Control-Allow-Origin "*";
  }

  error_page 404 /404.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
