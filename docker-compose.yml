# ====================================================================
# Self-hosted Cash-Flow stack for Coolify (single localhost server).
# Includes the app + a full self-hosted Supabase (no Lovable/Cloud deps).
#
# Coolify setup:
#   1. New resource -> "Docker Compose" -> point at this repo.
#   2. Repository preservation: NOT needed. Everything is COPY'd at build.
#   3. Set the env vars listed in `.env.example` in Coolify's UI.
#   4. Routing (Coolify Traefik labels — set per-service in Coolify UI):
#        app      -> APP_DOMAIN          -> port 3000
#        kong     -> SUPABASE_API_DOMAIN -> port 8000  (the Supabase API)
#      studio is bound to 127.0.0.1 only; reach it via SSH tunnel:
#        ssh -L 3001:127.0.0.1:3001 user@server   then open http://localhost:3001
#
# First boot:
#   - `db` runs Supabase's bootstrap scripts AND your repo's migrations
#     (mounted from ./supabase/migrations, sorted by filename).
#   - `auth`, `rest`, `storage`, `realtime`, `meta`, `kong`, `studio` come up.
#   - `app` builds against the kong API URL.
#
# Backups: the `db-data` named volume holds Postgres data. Snapshot it.
# ====================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------- Application ----------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* vars at build time. The app talks to Supabase via
        # the public-facing kong URL (set this to https://supabase.example.com).
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        VITE_SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID:-self-hosted}
    image: cash-flow-app:latest
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_SERVICE_NAME: ${LOG_SERVICE_NAME:-cash-flow}
      # Server-side Supabase access. Server fns talk to kong over the internal
      # docker network; browser code uses SUPABASE_PUBLIC_URL above.
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      # Mirror VITE_* for any server code that reads them
      VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      VITE_SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID:-self-hosted}
      # Observability
      METRICS_TOKEN: ${METRICS_TOKEN}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # Nextcloud (optional)
      NEXTCLOUD_BASE_URL: ${NEXTCLOUD_BASE_URL:-}
      NEXTCLOUD_CLIENT_ID: ${NEXTCLOUD_CLIENT_ID:-}
      NEXTCLOUD_CLIENT_SECRET: ${NEXTCLOUD_CLIENT_SECRET:-}
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *default-logging

  # ---------------- Postgres (Supabase-flavored) ----------------
  # Auto-runs Supabase init scripts AND every .sql in supabase/migrations.
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
      # supabase/postgres reads these to set up auth/storage roles on first boot.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    volumes:
      - db-data:/var/lib/postgresql/data
      # Your app's schema migrations. Filenames are timestamp-prefixed so they
      # apply in order. They run AFTER supabase's own bootstrap scripts.
      - ./supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      # Tiny shim that loops through migrations/ on first init.
      - ./docker/db/99-app-migrations.sh:/docker-entrypoint-initdb.d/99-app-migrations.sh:ro
    logging: *default-logging

  # ---------------- GoTrue (auth) ----------------
  auth:
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: ${APP_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Cash Flow}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ---------------- PostgREST (REST API over Postgres) ----------------
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: "postgrest"
    logging: *default-logging

  # ---------------- Realtime ----------------
  realtime:
    image: supabase/realtime:v2.34.43
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
    logging: *default-logging

  # ---------------- Storage ----------------
  storage:
    image: supabase/storage-api:v1.14.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - storage-data:/var/lib/storage
    logging: *default-logging

  # ---------------- postgres-meta (used by studio + kong) ----------------
  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    logging: *default-logging

  # ---------------- Kong (API gateway) ----------------
  # Single entry point on port 8000. Coolify exposes this as SUPABASE_API_DOMAIN.
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      realtime:
        condition: service_started
      storage:
        condition: service_started
      meta:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    volumes:
      - ./docker/kong/kong.yml:/home/kong/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${KONG_HOST_PORT:-8000}:8000"
    logging: *default-logging

  # ---------------- Studio (admin UI) ----------------
  # Bound to 127.0.0.1 only — reach via SSH tunnel.
  studio:
    image: supabase/studio:20250106-e00a12c
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Self-hosted
      DEFAULT_PROJECT_NAME: Cash Flow
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      LOGFLARE_API_KEY: stub
      LOGFLARE_URL: http://stub
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    ports:
      - "127.0.0.1:${STUDIO_HOST_PORT:-3001}:3000"
    logging: *default-logging

volumes:
  db-data:
  storage-data: