# ====================================================================
# Cash-Flow stack for Dokploy (Node SSR + External Supabase)
# Serves the frontend and server-side API routes via Node.
#
# DOKPLOY SETUP:
#   1. Create a new "Compose" resource in Dokploy.
#   2. Point it at your GitHub repository.
#   3. In the Dokploy Dashboard -> Environment Variables, add:
#        VITE_SUPABASE_URL
#        VITE_SUPABASE_PUBLISHABLE_KEY
#        SUPABASE_URL
#        SUPABASE_SERVICE_ROLE_KEY
#        SUPABASE_DB_URL
#        METRICS_TOKEN
#   4. Dokploy will automatically pass these during build and runtime.
# ====================================================================

services:
  # ---------- Migration runner (runs once before app starts) ----------
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: ${SUPABASE_DB_URL}
    networks:
      - default
      - supabase
    restart: "no"

  # ---------- Frontend app ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    image: cash-flow-app:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      LOG_SERVICE_NAME: ${LOG_SERVICE_NAME:-cash-flow}
      
      # Client-side variables
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      
      # Server-side variables (required for API routes)
      SUPABASE_URL: ${SUPABASE_URL:-$VITE_SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      
      # API Protection / Config
      METRICS_TOKEN: ${METRICS_TOKEN}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      
      # Optional: Nextcloud integration for attachments
      NEXTCLOUD_BASE_URL: ${NEXTCLOUD_BASE_URL:-}
      NEXTCLOUD_CLIENT_ID: ${NEXTCLOUD_CLIENT_ID:-}
      NEXTCLOUD_CLIENT_SECRET: ${NEXTCLOUD_CLIENT_SECRET:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  supabase:
    external: true
    name: ${SUPABASE_DOCKER_NETWORK}
