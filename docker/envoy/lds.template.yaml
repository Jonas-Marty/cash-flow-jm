# API gateway: listener, routes and filters. Upstream's lds.template.yaml
# (supabase/supabase docker/volumes/api/envoy), trimmed to the services this
# stack runs -- auth, rest, storage -- and to the legacy HS256 API keys:
#
#   dropped routes   studio (/), pg-meta (/pg/), functions, realtime, graphql,
#                    SAML, MCP, OAuth server metadata
#   dropped filters  dashboard basic auth, sb_* key translation (header and
#                    query), apikey-from-query copy, realtime x-api-key mirror
#
# ${ANON_KEY} and ${SERVICE_ROLE_KEY} are filled in by docker-entrypoint.sh.
# Unknown paths get a plain 404 instead of upstream's Studio catch-all.
resources:
  - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
    name: supabase
    per_connection_buffer_limit_bytes: 32768  # 32 KiB

    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8000

    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': >-
                type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              normalize_path: true
              merge_slashes: true
              path_with_escaped_slashes_action: REJECT_REQUEST
              # Traefik sits in front; trust one hop so X-Forwarded-For keeps
              # the real client address for GoTrue's rate limits and logs.
              use_remote_address: true
              xff_num_trusted_hops: 1
              common_http_protocol_options:
                headers_with_underscores_action: REJECT_REQUEST
              access_log:
                - name: envoy.access_loggers.stdout
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    log_format:
                      text_format_source:
                        # Path without the query string: PostgREST filters
                        # can carry personal data (descriptions, amounts).
                        inline_string: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% - - [%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] \"%REQ(:METHOD)% %REQ_WITHOUT_QUERY(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %BYTES_SENT% %DURATION%ms\n"
                      formatters:
                        - name: envoy.formatter.req_without_query
                          typed_config:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.formatter.req_without_query.v3.ReqWithoutQuery

              route_config:
                name: supabase_route
                virtual_hosts:
                  - name: supabase_host
                    domains:
                      - '*'
                    # Same as Kong's cors plugin: any origin, no credentials.
                    # The boundary is the apikey/JWT, never the origin. As a
                    # per-filter policy: VirtualHost.cors (upstream's form) is
                    # deprecated and slated for removal.
                    typed_per_filter_config:
                      envoy.filters.http.cors:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                        allow_origin_string_match:
                          - safe_regex:
                              regex: ".*"
                        allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD"
                        allow_headers: "*"
                        expose_headers: "*"
                        max_age: "3600"
                    request_headers_to_add:
                      - header:
                          key: X-Forwarded-Host
                          value: "%REQ(:AUTHORITY)%"
                        append_action: ADD_IF_ABSENT
                      - header:
                          key: X-Forwarded-Port
                          value: "%DOWNSTREAM_LOCAL_PORT%"
                        append_action: ADD_IF_ABSENT
                    routes:
                      # --- open: browser redirects, which cannot send an apikey ---
                      - match:
                          prefix: /auth/v1/verify
                        route:
                          cluster: auth
                          prefix_rewrite: /verify
                          timeout: 30s
                        typed_per_filter_config: &allow_all
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  allow_all:
                                    permissions:
                                      - any: true
                                    principals:
                                      - any: true

                      - match:
                          prefix: /auth/v1/callback
                        route:
                          cluster: auth
                          prefix_rewrite: /callback
                          timeout: 30s
                        typed_per_filter_config: *allow_all

                      - match:
                          prefix: /auth/v1/authorize
                        route:
                          cluster: auth
                          prefix_rewrite: /authorize
                          timeout: 30s
                        typed_per_filter_config: *allow_all

                      # --- storage checks the JWT itself ---
                      - match:
                          prefix: /storage/v1/
                        route:
                          cluster: storage
                          prefix_rewrite: /
                          # Uploads go up to 50 MB (FILE_SIZE_LIMIT).
                          timeout: 120s
                        request_headers_to_add:
                          - header:
                              key: X-Forwarded-Prefix
                              value: /storage/v1
                            append_action: ADD_IF_ABSENT
                        typed_per_filter_config: *allow_all

                      # --- protected: apikey must be the anon or service key ---
                      - name: auth-v1-protected
                        match:
                          prefix: /auth/v1/
                        route:
                          cluster: auth
                          prefix_rewrite: /
                          timeout: 30s

                      # The OpenAPI schema root lists every table and RPC:
                      # service key only.
                      - name: rest-v1-openapi-protected
                        match:
                          path: /rest/v1/
                        route:
                          cluster: rest
                          prefix_rewrite: /
                          timeout: 30s
                        typed_per_filter_config:
                          envoy.filters.http.rbac:
                            '@type': >-
                              type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                            rbac:
                              rules:
                                action: ALLOW
                                policies:
                                  admin:
                                    permissions:
                                      - any: true
                                    principals:
                                      - header:
                                          name: apikey
                                          string_match:
                                            exact: '${SERVICE_ROLE_KEY}'

                      - name: rest-v1-protected
                        match:
                          prefix: /rest/v1/
                        route:
                          cluster: rest
                          prefix_rewrite: /
                          timeout: 30s

                      # --- everything else ---
                      - match:
                          prefix: /
                        direct_response:
                          status: 404
                          body:
                            inline_string: '{"message":"not found"}'
                        typed_per_filter_config: *allow_all

              http_filters:
                - name: envoy.filters.http.cors
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors

                # 401 for a missing or wrong apikey on the protected routes.
                - name: envoy.filters.http.lua
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    default_source_code:
                      inline_string: |
                        local ANON_KEY = "${ANON_KEY}"
                        local SERVICE_ROLE_KEY = "${SERVICE_ROLE_KEY}"

                        local PROTECTED_ROUTES = {
                          ["auth-v1-protected"] = true,
                          ["rest-v1-openapi-protected"] = true,
                          ["rest-v1-protected"] = true,
                        }

                        function envoy_on_request(request_handle)
                          local route_name = request_handle:streamInfo():routeName()
                          if route_name == nil or not PROTECTED_ROUTES[route_name] then
                            return
                          end

                          local apikey = request_handle:headers():get("apikey")
                          if apikey ~= nil and apikey ~= "" and (apikey == ANON_KEY or apikey == SERVICE_ROLE_KEY) then
                            return
                          end

                          request_handle:respond({
                            [":status"] = "401",
                            ["content-type"] = "application/json",
                          }, '{"message":"Invalid API key"}')
                        end

                # With no real JWT in Authorization, use the apikey as the
                # bearer token (anon), as the platform does.
                - name: envoy.filters.http.lua
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    default_source_code:
                      inline_string: |
                        function envoy_on_request(request_handle)
                          local headers = request_handle:headers()
                          local auth = headers:get("authorization")
                          if auth ~= nil and string.sub(auth, 1, 7) == "Bearer " then
                            return
                          end

                          local apikey = headers:get("apikey")
                          if apikey ~= nil and apikey ~= "" then
                            headers:replace("authorization", "Bearer " .. apikey)
                          end
                        end

                # Belt and braces behind the Lua check: /auth/v1/ and /rest/v1/
                # only with one of the two keys; per-route overrides above
                # open the redirect, storage and 404 routes.
                - name: envoy.filters.http.rbac
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                    rules:
                      action: ALLOW
                      policies:
                        apikey:
                          permissions:
                            - url_path:
                                path:
                                  prefix: /auth/v1/
                            - url_path:
                                path:
                                  prefix: /rest/v1/
                          principals:
                            - header:
                                name: apikey
                                string_match:
                                  exact: '${SERVICE_ROLE_KEY}'
                            - header:
                                name: apikey
                                string_match:
                                  exact: '${ANON_KEY}'

                - name: envoy.filters.http.router
                  typed_config:
                    '@type': >-
                      type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
