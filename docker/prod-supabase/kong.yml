# ====================================================================
# Kong declarative config for the PRODUCTION Supabase stack.
#
# This is the reviewable copy. The live one is a Dokploy File Mount at
# /volumes/api/kong.yml, mounted read-only at /home/kong/temp.yml; kong's
# entrypoint shell-expands the $VARS in it before handing it to Kong, so
# anything with a $ here is expanded -- keep that to SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_KEY, DASHBOARD_USERNAME, DASHBOARD_PASSWORD and
# CONTAINER_PREFIX.
#
# Upstream's file, minus the routes whose upstreams no longer exist:
#   functions-v1  -> the edge runtime is gone. /functions/v1/* now 404s at
#                    the gateway instead of 502-ing at a dead container.
#   analytics-v1  -> logflare is gone.
# Restore either alongside its service block in
# docker-compose.prod-supabase.yml if you ever need it back.
#
#   graphql-v1    -> unused (no GraphQL calls; pg_graphql is not relied on).
#   realtime-v1-* -> realtime is gone. Its /api route also let anyone holding
#                    the public anon key list, create and delete Realtime
#                    tenants; upstream now blocks it as a security fix.
# (graphql and realtime removed 2026-09-25.)
#
# This supersedes docker/kong/kong.yml, which was removed in the same change:
# it was unreferenced by any compose file and routed realtime at a hostname
# that never existed in this deployment.
# ====================================================================
_format_version: '2.1'
_transform: true

###
### Consumers / Users
###
consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### Dashboard credentials
###
basicauth_credentials:
  - consumer: DASHBOARD
    username: $DASHBOARD_USERNAME
    password: $DASHBOARD_PASSWORD

###
### API Routes
###
services:
  ## Open Auth routes
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  ## Secure Auth routes
  - name: auth-v1
    _comment: 'GoTrue: /auth/v1/* -> http://auth:9999/*'
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure REST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Storage routes: the storage server manages its own auth
  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors

  ## Secure Database routes
  - name: meta
    _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## Protected Dashboard - catch all remaining routes
  - name: dashboard
    _comment: 'Studio: /* -> http://studio:3000/*'
    url: http://studio:3000/
    routes:
      - name: dashboard-all
        strip_path: true
        paths:
          - /
    plugins:
      - name: cors
      - name: basic-auth
        config:
          hide_credentials: true
