# ====================================================================
# Trimmed self-hosted Supabase for PRODUCTION (Dokploy compose resource
# "supabase" in project Cash Flow -> production, app name
# cash-flow-supabase-e2meaa).
#
# This file is the reviewable source of truth. The deployed copy lives in
# Dokploy's database (sourceType "raw"), edited through the UI -- so paste
# this in and redeploy rather than expecting a git push to do it. See
# docs/supabase-stack-trim.md for the full runbook.
#
# Upstream ships 13 services; this runs 5. Dropped, with the reason:
#
#   analytics (logflare)  1.5 GB resident -- larger than any other container
#                         on the host -- to collect logs nobody reads. Its
#                         _analytics schema was 128 MB of the 137 MB
#                         _supabase database; the app's own database is 16 MB.
#   vector                Only ever fed logflare. It also bind-mounted
#                         /var/run/docker.sock, so this is one less container
#                         with a handle on the daemon.
#   supavisor (pooler)    Nothing connected to it: zero established sessions,
#                         while it held 27 of the database's 100
#                         max_connections for its own bookkeeping. It also
#                         published 0.0.0.0:5432 and 0.0.0.0:6543. The migrate
#                         sidecar and scripts/dev/* reach db:5432 directly.
#   functions (edge)      No supabase.functions.invoke anywhere and no
#                         supabase/functions/ directory. Scheduled work runs
#                         as token-guarded HTTP routes hit by host cron
#                         (README section 5). To bring it back, restore the
#                         service block plus upstream's functions route in
#                         docker/envoy/lds.template.yaml.
#
#   realtime              Unused (the supabase_realtime publication has 0
#                         tables, no .channel() in src/), and its /api/tenants
#                         admin API accepted the public anon key through
#                         the gateway -- upstream now blocks that route as a
#                         security fix. Removed 2026-09-25 with its routes.
#   imgproxy              No storage call passes a transform: option; the
#                         2022 build predated the libwebp fix and was reachable
#                         through /storage/v1/render/image. Removed 2026-09-25.
#
# The gateway is Envoy (docker/envoy/: upstream's config trimmed to auth, rest
# and storage). It replaced Kong 2.8.5, which is end of life, on 2026-09-26;
# see docs/gateway-migration.md.
#
# Studio and pg-meta were removed 2026-09-25: an old Next.js with open
# advisories on the public domain behind one basic-auth password, whose SQL
# editor ran as the superuser. For the rare direct look at the data, the db
# port is published on the host's loopback (127.0.0.1:54322) for a desktop
# client through an SSH tunnel -- see docs/database-access.md.
#
# mem_limit on every service is a guardrail against a runaway, not a tuning
# knob. The ceilings are deliberately loose because a limit set too tight
# turns a normal spike into an OOMKill, which is far worse than the leak it
# prevents.
#
# Two things Dokploy owns and this file must NOT restate:
#   * the traefik.* labels on envoy -- injected from the Domains tab
#     (cash-flow-supabase.wi-wo.ch -> service envoy, port 8000);
#   * the ../files/volumes/* sources -- those are the "File Mounts" tab.
#
# Do not rename the "db" service: the nightly backup to Garage S3 is keyed on
# it. Do not rename the network: docker-compose.yml joins it by the fixed name
# in SUPABASE_DOCKER_NETWORK.
# ====================================================================
name: supabase
services:
  envoy:
    container_name: ${CONTAINER_PREFIX}-envoy
    image: envoyproxy/envoy:v1.39.1
    mem_limit: 256m
    restart: unless-stopped
    expose:
      - 8000
    # Same files as docker/envoy/ in the repo; here they are Dokploy File
    # Mounts under /volumes/api/envoy/. A redeploy does not restart Envoy when
    # only these files change -- restart the container, then check its log
    # for "rejected".
    volumes:
      - ../files/volumes/api/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro,z
      - ../files/volumes/api/envoy/cds.yaml:/etc/envoy/cds.yaml:ro,z
      - ../files/volumes/api/envoy/lds.template.yaml:/etc/envoy/lds.template.yaml:ro,z
      - ../files/volumes/api/envoy/docker-entrypoint.sh:/docker-entrypoint.sh:ro,z
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    healthcheck:
      # The image has neither curl nor wget.
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - cash-flow-supabase-e2meaa
  auth:
    container_name: ${CONTAINER_PREFIX}-auth
    image: supabase/gotrue:v2.197.0
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://localhost:9999/health
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_MAILER_EXTERNAL_HOSTS: ${SUPABASE_HOST}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      # The app, not the API host: GoTrue falls back here whenever a
      # redirect_to is not on the allow list, and the API host only answers
      # {"message":"Unauthorized"}.
      GOTRUE_SITE_URL: https://cash-flow.wi-wo.ch
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE}
      # Upstream's template defaults both to true, which let anyone create a
      # confirmed account with any phone number and no SMS provider at all.
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      # Settings -> Linked sign-in methods: attach another sign-in method (e.g.
      # the OIDC provider) to the account you are signed in with.
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: "true"
      # Custom OIDC providers (Settings -> Integrations) return to
      # <this>/callback. GoTrue sits behind the gateway's /auth/v1, and
      # without this it would send the provider back to
      # <API_EXTERNAL_URL>/callback, a 404.
      GOTRUE_CUSTOM_OAUTH_EXTERNAL_URL: ${API_EXTERNAL_URL}/auth/v1
    networks:
      - cash-flow-supabase-e2meaa
  rest:
    container_name: ${CONTAINER_PREFIX}-rest
    image: postgrest/postgrest:v14.18
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgrest
    networks:
      - cash-flow-supabase-e2meaa
  storage:
    container_name: ${CONTAINER_PREFIX}-storage
    image: supabase/storage-api:v1.74.0
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - ../files/volumes/storage:/var/lib/storage:z
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --spider
        - http://storage:5000/status
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      # No imgproxy: nothing passes a transform: option.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    networks:
      - cash-flow-supabase-e2meaa
  db:
    container_name: ${CONTAINER_PREFIX}-db
    image: supabase/postgres:15.14.1.176
    mem_limit: 1g
    restart: unless-stopped
    # For a desktop client (DBeaver, HeidiSQL) through an SSH tunnel to the
    # host. Bound to the host's loopback only: nothing on the network reaches
    # it. See docs/database-access.md.
    ports:
      - 127.0.0.1:54322:5432
    volumes:
      - ../files/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ../files/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ../files/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ../files/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ../files/volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - postgres
        - -h
        - localhost
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    networks:
      - cash-flow-supabase-e2meaa
volumes:
  db-config: null
networks:
  cash-flow-supabase-e2meaa:
    name: cash-flow-supabase-e2meaa
    external: true
